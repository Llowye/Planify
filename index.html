<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tugas-3 Algoritma</title>
  <style>
    body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 16px; }
    .app { background: white; width: 100%; max-width: 420px; padding: 20px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
    h1 { margin-top: 0; text-align: center; font-size: 22px; }
    input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; margin-bottom: 8px; }
    button { padding: 10px 14px; border: none; border-radius: 8px; background: #4f46e5; color: white; font-size: 16px; cursor: pointer; }
    #hasil { margin-top: 16px; line-height: 1.6; }
  </style>
</head>
<body>
<div class="app">
  <h1>Tugas-3 Algoritma</h1>
  <input type="text" id="angka" placeholder="Angka dipisah koma, contoh: 5, 3, 8, 1, 9">
  <input type="text" id="cari" placeholder="Angka yang dicari, contoh: 8">
  <button onclick="proses()">Proses</button>
  <div id="hasil"></div>
</div>

<script>
/**
 * ============================================================
 * File      : tugas3.html
 * Deskripsi : Tugas-3 Algoritma & Struktur Data
 *             - Bubble Sort (pengurutan)
 *             - Linear Search (pencarian)
 *             - Pengukuran waktu eksekusi (profiling)
 * Penulis   : Kelompok 6
 * Versi     : 1.0
 * Catatan perubahan:
 *   v1.0 (16 Okt 2026) - Versi awal
 * ============================================================
 */

/**
 * Bubble Sort: bandingkan 2 angka bersebelahan, tukar kalau salah urutan.
 * Return: array baru yang sudah terurut dari kecil ke besar.
 */
function bubbleSort(data) {
  var arr = data.slice();
  for (var i = 0; i < arr.length - 1; i++) {
    for (var j = 0; j < arr.length - i - 1; j++) {
      if (arr[j] > arr[j + 1]) {
        var temp = arr[j];
        arr[j] = arr[j + 1];
        arr[j + 1] = temp;
      }
    }
  }
  return arr;
}

/**
 * Linear Search: cek satu per satu dari depan sampai ketemu.
 * Return: indeks angka yang dicari, atau -1 kalau tidak ada.
 */
function linearSearch(data, cari) {
  for (var i = 0; i < data.length; i++) {
    if (data[i] === cari) {
      return i;
    }
  }
  return -1;
}

/**
 * Fungsi utama: dipanggil saat tombol Proses diklik.
 * Mengurutkan angka, mengukur waktunya, lalu mencari angka.
 */
function proses() {
  var teks = document.getElementById("angka").value;
  var cari = Number(document.getElementById("cari").value);

  var data = teks.split(",").map(Number).filter(function (x) {
    return !isNaN(x);
  });

  if (teks.trim() === "" || data.length === 0) {
    document.getElementById("hasil").innerHTML = "Isi angka dulu ya, pisahkan pakai koma.";
    return;
  }

  var mulai = performance.now();
  var terurut = bubbleSort(data);
  var selesai = performance.now();
  var waktu = (selesai - mulai).toFixed(4);

  var posisi = linearSearch(data, cari);
  var infoCari = posisi === -1 ? "tidak ketemu" : "ketemu di indeks " + posisi;

  document.getElementById("hasil").innerHTML =
    "<b>Data asli:</b> " + data.join(", ") + "<br>" +
    "<b>Hasil Bubble Sort:</b> " + terurut.join(", ") + "<br>" +
    "<b>Waktu eksekusi:</b> " + waktu + " ms<br>" +
    "<b>Linear Search angka " + cari + ":</b> " + infoCari;
}
</script>
</body>
</html>
