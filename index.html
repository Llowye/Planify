<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List Array</title>
  <style>
    body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
    .app { background: white; width: 100%; max-width: 440px; padding: 20px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
    h1 { margin-top: 0; text-align: center; }
    .baris { display: flex; gap: 8px; margin-bottom: 8px; }
    input[type=text], select { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; min-width: 0; }
    button { padding: 10px 14px; border: none; border-radius: 8px; background: #4f46e5; color: white; font-size: 16px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee; }
    li .no { color: #999; width: 22px; }
    li .teks { flex: 1; }
    li input[type=checkbox] { width: 20px; height: 20px; cursor: pointer; }
    li.selesai .teks { text-decoration: line-through; color: #999; }
    li button { background: #ef4444; padding: 4px 10px; }
    .info { text-align: center; color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <div class="app">
    <h1>📝 To-Do List Array</h1>

    <div class="baris">
      <input type="text" id="inputTugas" placeholder="Tulis tugas baru...">
      <button id="tombolTambah">Tambah</button>
    </div>
    <div class="baris">
      <input type="text" id="inputCari" placeholder="🔍 Cari tugas...">
      <select id="pilihUrut">
        <option value="lama">Terlama dulu</option>
        <option value="baru">Terbaru dulu</option>
        <option value="az">A → Z</option>
        <option value="za">Z → A</option>
        <option value="belum">Belum selesai dulu</option>
      </select>
    </div>

    <ul id="daftar"></ul>
    <p class="info" id="info"></p>
  </div>

  <script>
    // ===== BAGIAN 1: DATA (struktur data ARRAY) =====
    // Semua tugas disimpan dalam satu array. Tiap tugas = objek { teks, selesai }.
    // localStorage = penyimpanan browser, supaya data tidak hilang saat di-refresh.
    let tugas = JSON.parse(localStorage.getItem("tugas")) || [];

    const inputTugas = document.getElementById("inputTugas");
    const inputCari  = document.getElementById("inputCari");
    const pilihUrut  = document.getElementById("pilihUrut");
    const daftar     = document.getElementById("daftar");
    const info       = document.getElementById("info");

    function simpan() {
      localStorage.setItem("tugas", JSON.stringify(tugas));
    }

    // ===== BAGIAN 2: SORTING dengan BUBBLE SORT =====
    // Aturan: apakah A harus berada SETELAH B? (true = tukar posisi)
    function harusTukar(a, b, urut) {
      if (urut === "az")    return a.teks.toLowerCase() > b.teks.toLowerCase();
      if (urut === "za")    return a.teks.toLowerCase() < b.teks.toLowerCase();
      if (urut === "belum") return a.selesai && !b.selesai;
      if (urut === "baru")  return a.id < b.id;
      return a.id > b.id;                                  // "lama"
    }

    function urutkan(arr, urut) {
      const n = arr.length;
      for (let i = 0; i < n - 1; i++) {                    // ulangi n-1 putaran
        for (let j = 0; j < n - i - 1; j++) {              // bandingkan pasangan bertetangga
          if (harusTukar(arr[j], arr[j + 1], urut)) {
            const sementara = arr[j];                      // tukar lewat variabel sementara
            arr[j] = arr[j + 1];
            arr[j + 1] = sementara;
          }
        }
      }
      return arr;
    }

    // ===== BAGIAN 3: TAMPILKAN = searching + sorting + traversal =====
    function tampilkan() {
      const cari = inputCari.value.trim().toLowerCase();

      // SEARCHING (linear search): cek tugas satu per satu dari awal sampai akhir.
      // "id" menyimpan posisi ASLI di array tugas, supaya setelah diurutkan,
      // centang/hapus tetap mengenai tugas yang benar.
      let hasil = [];
      tugas.forEach(function (t, i) {                      // TRAVERSAL #1: forEach
        if (cari === "" || t.teks.toLowerCase().includes(cari)) {
          hasil.push({ id: i, teks: t.teks, selesai: t.selesai });
        }
      });

      hasil = urutkan(hasil, pilihUrut.value);             // SORTING

      daftar.innerHTML = "";
      for (let i = 0; i < hasil.length; i++) {             // TRAVERSAL #2: for dengan indeks
        const t = hasil[i];
        const li = document.createElement("li");
        if (t.selesai) li.classList.add("selesai");

        const no = document.createElement("span");
        no.className = "no";
        no.textContent = (i + 1) + ".";

        const centang = document.createElement("input");
        centang.type = "checkbox";
        centang.checked = t.selesai;
        centang.onchange = function () { ubahStatus(t.id); };

        const teks = document.createElement("span");
        teks.className = "teks";
        teks.textContent = t.teks;                         // textContent = aman dari kode jahat

        const hapus = document.createElement("button");
        hapus.textContent = "✕";
        hapus.onclick = function () { hapusTugas(t.id); };

        li.append(no, centang, teks, hapus);
        daftar.appendChild(li);
      }

      let selesai = 0;                                     // TRAVERSAL #3: hitung statistik
      for (const t of tugas) { if (t.selesai) selesai++; }

      if (tugas.length === 0) info.textContent = "Belum ada tugas. Yuk tambah!";
      else if (hasil.length === 0) info.textContent = 'Tidak ada tugas yang cocok dengan "' + inputCari.value.trim() + '".';
      else info.textContent = "Menampilkan " + hasil.length + " dari " + tugas.length + " tugas · " + selesai + " selesai";
    }

    // ===== BAGIAN 4: AKSI (tambah / ubah / hapus) =====
    function tambahTugas() {
      const teks = inputTugas.value.trim();
      if (teks === "") return;
      tugas.push({ teks: teks, selesai: false });          // tambah di ujung array
      inputTugas.value = "";
      simpan();
      tampilkan();
    }

    function ubahStatus(id) {
      tugas[id].selesai = !tugas[id].selesai;              // balik true/false
      simpan();
      tampilkan();
    }

    function hapusTugas(id) {
      tugas.splice(id, 1);                                 // buang 1 item di posisi id
      simpan();
      tampilkan();
    }

    // ===== BAGIAN 5: EVENT (hubungkan aksi pengguna dengan fungsi) =====
    document.getElementById("tombolTambah").addEventListener("click", tambahTugas);
    inputTugas.addEventListener("keydown", function (e) { if (e.key === "Enter") tambahTugas(); });
    inputCari.addEventListener("input", tampilkan);        // mengetik di kotak cari = hasil langsung berubah
    pilihUrut.addEventListener("change", tampilkan);

    tampilkan();
  </script>
</body>
</html>
